name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 10 hours - safely under Streamlit's 12-hour sleep threshold.
    # Cron uses UTC. Adjust the hours below if you want it aligned to a
    # specific timezone's business hours instead of round-the-clock.
    - cron: "0 */10 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app to keep it awake
        env:
          STREAMLIT_APP_URL: "https://churn-lifecycle-mgmt-v2.streamlit.app/"
        run: python keep_awake.py
